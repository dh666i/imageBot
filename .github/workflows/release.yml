name: 发布新版

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 获取源码
        uses: actions/checkout@v7.0.0

      - name: 准备 Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: 自动测试
        shell: pwsh
        run: ./scripts/Test-ImageBot.ps1

      - name: 生成发布包
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/New-ReleasePackage.ps1 -Tag "${{ github.ref_name }}" -OutputDirectory ./dist

      - name: 保存构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ImageBot-${{ github.ref_name }}
          path: |
            dist/ImageBot-${{ github.ref_name }}.zip
            dist/ImageBot-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

      - name: 发布到 GitHub
        uses: softprops/action-gh-release@v3.0.1
        with:
          name: ImageBot ${{ github.ref_name }}
          files: |
            dist/ImageBot-${{ github.ref_name }}.zip
            dist/ImageBot-${{ github.ref_name }}.zip.sha256
          body: |
            # ImageBot ${{ github.ref_name }} 更新说明

            ## 本版更新

            - 支持 GPT Image 2.6 Flare 和 Sunburst，新增画面复杂度选项，并保留旧模型和自定义模型。
            - 全新黑白聊天界面，可选择浅色、深色或跟随系统外观。
            - 输入框附近即可切换模型和图片比例；图片、接口、本地文件和更新设置分开整理。
            - 历史记录支持搜索和加载更多，修复首次打开时历史记录可能加载失败的问题。
            - 图片可在页面内放大预览、切换同批图片、下载和继续修改。
            - 自动保留未发送的文字草稿；刷新后会提醒重新添加参考图片。
            - 改善小屏幕布局、键盘操作、按钮反馈和设置返回流程。
            - 模型切换时同步调整可用参数，基础参数模式会移除不兼容的复杂度等选项。
            - 默认接口地址为 `https://www.chichiapi.cn/`，默认等待 240 秒。升级保留原有配置、图片和历史。

            ## 开始使用

            1. 下载 `ImageBot-${{ github.ref_name }}.zip`。
            2. 完整解压压缩包。
            3. 双击 `ImageBot.exe`。
            4. 第一次打开时填写接口密钥并保存。
            5. 输入想生成的画面，也可以上传参考图片，然后点击“生成”。

            ## 旧版本升级

            旧版本可以直接使用页面内更新。更新完成后，启动器会在退出并重新启动时自动替换为新版本；如果版本过旧无法完成替换，请手动下载本版压缩包并重新解压，原来的 `config.ini` 可以继续使用。

            ## 说明

            - 更新与恢复不会删除 `config.ini`、历史记录、日志或已生成图片。
            - `ImageBot-${{ github.ref_name }}.zip.sha256` 用于核对下载文件完整性。
            - 未配置 Windows 代码签名证书时，系统可能在首次运行时显示安全提示。
            - 发布包不包含作者的接口密钥或本地生成记录。
